<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流程图编辑器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="toolbar">
    <span class="brand">流程图编辑器</span>
    <button id="btn-add">添加节点</button>
    <button id="btn-connect">连线</button>
    <button id="btn-delete">删除</button>
    <span class="sep"></span>
    <label><input type="checkbox" id="chk-snap" checked> 吸附/对齐</label>
    <label><input type="checkbox" id="chk-grid" checked> 网格</label>
    <span class="sep"></span>
    <button id="btn-export-svg">导出 SVG</button>
    <button id="btn-export-png">导出 PNG</button>
    <button id="btn-export-json">导出 JSON</button>
    <button id="btn-import-json">导入 JSON</button>
    <input type="file" id="file-import" accept="application/json,.json" hidden>
  </header>
  <div id="hint"></div>
  <main id="stage">
    <svg id="canvas" preserveAspectRatio="none">
      <defs>
        <style>
          .node { cursor: move; }
          .node-rect { stroke: rgba(0,0,0,.18); stroke-width: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.15)); }
          .node-rect.selected { stroke: #1d4ed8; stroke-width: 2.5; }
          .node-rect.connect-from { stroke: #f59e0b; stroke-width: 2.5; stroke-dasharray: 6 3; }
          .node-label { fill: #fff; font-size: 14px; font-family: sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; user-select: none; }
          .edge { fill: none; stroke: #5b6b7f; stroke-width: 2; cursor: pointer; }
          .edge:hover { stroke: #334155; }
          .edge.selected { stroke: #1d4ed8; stroke-width: 3; }
          .edge.degraded { stroke: #e05d5d; stroke-dasharray: 8 4; }
          .guide { stroke: #f43f5e; stroke-width: 1; stroke-dasharray: 5 4; pointer-events: none; }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7f"></path>
        </marker>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8ecf1" stroke-width="1"></path>
        </pattern>
      </defs>
      <rect id="grid-rect" fill="url(#grid)"></rect>
      <g id="edge-layer"></g>
      <g id="node-layer"></g>
      <g id="overlay-layer"></g>
    </svg>
  </main>
  <div id="toast-container"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
